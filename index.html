<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kentaro Terra Hub</title>
  <meta name="description" content="Completa 3 misiones y reclama el rango exclusivo Terra en el Discord de Kentaro.">
  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a22;
      --card2: #19232e;
      --borde: #243242;
      --texto: #e8eef5;
      --suave: #8fa1b3;
      --terra: #3ddc84;
      --terra2: #1fa862;
      --rojo: #ff4757;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #12261c 0%, var(--bg) 55%) fixed;
      color: var(--texto);
      min-height: 100vh;
      line-height: 1.5;
    }
    .wrap { width: min(640px, 92%); margin: 0 auto; padding: 40px 0 60px; }

    header { text-align: center; margin-bottom: 32px; }
    .badge {
      display: inline-block; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--terra); border: 1px solid var(--terra2); padding: 4px 12px; border-radius: 99px; margin-bottom: 14px;
    }
    h1 { font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; }
    h1 span { color: var(--terra); }
    header p { color: var(--suave); margin-top: 12px; }

    .progreso { margin: 28px 0 22px; }
    .progreso-top { display: flex; justify-content: space-between; font-size: .85rem; color: var(--suave); margin-bottom: 8px; }
    .barra { height: 10px; background: var(--card2); border-radius: 99px; overflow: hidden; }
    .barra div { height: 100%; width: 0; background: linear-gradient(90deg, var(--terra2), var(--terra)); transition: width .5s ease; }

    .mision {
      background: var(--card); border: 1px solid var(--borde); border-radius: 16px;
      padding: 20px; margin-bottom: 14px; display: flex; gap: 16px; align-items: center;
      transition: border-color .3s, transform .2s;
    }
    .mision.hecha { border-color: var(--terra2); }
    .num {
      flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--card2);
      display: grid; place-items: center; font-size: 1.3rem; font-weight: 700;
    }
    .mision.hecha .num { background: var(--terra2); color: #04140b; }
    .info { flex: 1; min-width: 0; }
    .info h3 { font-size: 1.05rem; }
    .info p { color: var(--suave); font-size: .88rem; margin-top: 2px; }

    button, .btn {
      font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 10px;
      padding: 10px 16px; background: var(--terra); color: #04140b; text-decoration: none;
      display: inline-block; text-align: center; transition: filter .2s, transform .1s;
      white-space: nowrap;
    }
    button:hover, .btn:hover { filter: brightness(1.1); }
    button:active { transform: scale(.97); }
    button:disabled { background: var(--card2); color: var(--suave); cursor: not-allowed; filter: none; }
    .btn-sec { background: var(--card2); color: var(--texto); border: 1px solid var(--borde); }
    .acciones { display: flex; flex-direction: column; gap: 8px; }

    .reclamar { margin-top: 26px; text-align: center; }
    .reclamar button { width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 14px; }

    .recompensa {
      display: none; margin-top: 26px; text-align: center; background: var(--card);
      border: 1px solid var(--terra2); border-radius: 16px; padding: 26px 20px;
      box-shadow: 0 0 40px rgba(61, 220, 132, .12);
    }
    .recompensa.visible { display: block; animation: aparecer .5s ease; }
    .recompensa h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .recompensa p { color: var(--suave); font-size: .9rem; }
    .codigo {
      margin: 18px 0; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 700; letter-spacing: .06em;
      color: var(--terra); background: var(--bg); border: 2px dashed var(--terra2);
      padding: 14px; border-radius: 12px; word-break: break-all;
    }
    .recompensa .fila { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px);
      background: var(--card2); border: 1px solid var(--borde); padding: 12px 18px;
      border-radius: 12px; opacity: 0; pointer-events: none; transition: all .3s; font-size: .9rem;
      max-width: 90%; text-align: center;
    }
    .toast.ver { opacity: 1; transform: translate(-50%, 0); }

    footer { text-align: center; color: var(--suave); font-size: .8rem; margin-top: 40px; }

    @keyframes aparecer { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (max-width: 480px) {
      .mision { flex-wrap: wrap; }
      .acciones { width: 100%; flex-direction: row; }
      .acciones > * { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">Rango exclusivo</span>
      <h1>Kentaro <span>Terra</span> Hub</h1>
      <p>Completa las 3 misiones, reclama tu código y canjéalo en el Discord para obtener el rango <b>Terra</b>.</p>
    </header>

    <div class="progreso">
      <div class="progreso-top"><span>Progreso</span><span id="contador">0 / 3</span></div>
      <div class="barra"><div id="barra"></div></div>
    </div>

    <div id="misiones"></div>

    <div class="reclamar">
      <button id="btnReclamar" disabled>🔒 Reclamar recompensa</button>
    </div>

    <div class="recompensa" id="recompensa">
      <h2>🎉 ¡Misiones completadas!</h2>
      <p>Este es tu código. Pégalo en el Discord para recibir el rango Terra.</p>
      <div class="codigo" id="codigo">Terra-------</div>
      <div class="fila">
        <button id="btnCopiar">📋 Copiar código</button>
        <a class="btn btn-sec" id="btnDiscord" target="_blank" rel="noopener">Ir al Discord</a>
      </div>
    </div>

    <footer>© 2026 Kentaro Terra Hub</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ============ CONFIGURACIÓN ============ */
    const CANAL_URL     = "https://www.youtube.com/@kentaro_gamer";
    const SUSCRIBIR_URL = CANAL_URL + "?sub_confirmation=1"; // abre el canal con el aviso de suscripción
    const VIDEOS_URL    = CANAL_URL + "/videos";
    const DISCORD_URL   = "https://discord.gg/AmVt4dXys"; // <-- pon aquí tu link de Discord
    const SEGUNDOS_MIN  = 8; // tiempo mínimo fuera de la página para validar la misión
    /* ====================================== */

    const MISIONES = [
      { id: "sub",  icono: "🔔", titulo: "Suscríbete al canal",
        desc: "Ve al canal, suscríbete y vuelve aquí.", url: SUSCRIBIR_URL, boton: "Ir al canal" },
      { id: "like", icono: "👍", titulo: "Dale like a un video",
        desc: "Elige cualquier video, dale like y vuelve.", url: VIDEOS_URL, boton: "Ver videos" },
      { id: "com",  icono: "💬", titulo: "Comenta en un video",
        desc: "Deja un comentario en cualquier video y vuelve.", url: VIDEOS_URL, boton: "Ver videos" }
    ];

    const KEY = "kentaro_terra_hub_v1";
    let estado = cargar();

    function cargar() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { hechas: {}, abiertas: {}, codigo: null }; }
      catch (e) { return { hechas: {}, abiertas: {}, codigo: null }; }
    }
    function guardar() {
      try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch (e) {}
    }

    const cont = document.getElementById("misiones");
    const toastEl = document.getElementById("toast");
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add("ver");
      clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("ver"), 3200);
    }

    function pintar() {
      cont.innerHTML = "";
      MISIONES.forEach((m, i) => {
        const hecha = !!estado.hechas[m.id];
        const abierta = !!estado.abiertas[m.id];
        const div = document.createElement("div");
        div.className = "mision" + (hecha ? " hecha" : "");
        div.innerHTML = `
          <div class="num">${hecha ? "✓" : m.icono}</div>
          <div class="info">
            <h3>Misión ${i + 1}: ${m.titulo}</h3>
            <p>${hecha ? "¡Completada!" : m.desc}</p>
          </div>
          <div class="acciones"></div>`;
        const acc = div.querySelector(".acciones");
        if (!hecha) {
          const ir = document.createElement("button");
          ir.textContent = m.boton;
          ir.onclick = () => abrir(m);
          acc.appendChild(ir);
          if (abierta) {
            const ya = document.createElement("button");
            ya.className = "btn-sec"; ya.style.background = "var(--card2)"; ya.style.color = "var(--texto)";
            ya.textContent = "Ya lo hice";
            ya.onclick = () => validar(m, true);
            acc.appendChild(ya);
          }
        }
        cont.appendChild(div);
      });

      const n = MISIONES.filter(m => estado.hechas[m.id]).length;
      document.getElementById("contador").textContent = n + " / 3";
      document.getElementById("barra").style.width = (n / 3 * 100) + "%";

      const btn = document.getElementById("btnReclamar");
      const todas = n === 3;
      btn.disabled = !todas || !!estado.codigo;
      btn.textContent = estado.codigo ? "✅ Recompensa reclamada" : (todas ? "🎁 Reclamar recompensa" : "🔒 Reclamar recompensa");

      if (estado.codigo) mostrarCodigo();
    }

    function abrir(m) {
      estado.abiertas[m.id] = Date.now();
      guardar();
      window.open(m.url, "_blank", "noopener");
      pintar();
      toast("Completa la misión y vuelve a esta pestaña.");
    }

    function validar(m, manual) {
      const t = estado.abiertas[m.id];
      if (!t || estado.hechas[m.id]) return;
      const seg = (Date.now() - t) / 1000;
      if (seg >= SEGUNDOS_MIN) {
        estado.hechas[m.id] = true;
        guardar(); pintar();
        toast("¡Misión completada! ✅");
      } else if (manual) {
        toast("Aún no… completa la misión en YouTube y vuelve.");
      }
    }

    // Al volver a la pestaña, valida automáticamente las misiones abiertas
    function alVolver() {
      if (document.visibilityState === "visible") {
        MISIONES.forEach(m => validar(m, false));
      }
    }
    document.addEventListener("visibilitychange", alVolver);
    window.addEventListener("focus", alVolver);

    /* ---------- Código de recompensa ----------
       Formato: Terra-XXXXXXC
       XXXXXX = 6 caracteres aleatorios, C = carácter de control (suma de posiciones mod 32).
       Sirve para detectar códigos inventados a simple vista o con un bot de Discord. */
    const ALFABETO = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 32 caracteres, sin O/0/I/1
    function generarCodigo() {
      let c = "";
      const arr = new Uint8Array(6);
      (window.crypto || window.msCrypto).getRandomValues(arr);
      arr.forEach(b => c += ALFABETO[b % 32]);
      let suma = 0;
      for (const ch of c) suma += ALFABETO.indexOf(ch) + 1;
      return "Terra-" + c + ALFABETO[suma % 32];
    }

    function mostrarCodigo() {
      document.getElementById("codigo").textContent = estado.codigo;
      document.getElementById("recompensa").classList.add("visible");
    }

    document.getElementById("btnReclamar").onclick = () => {
      if (MISIONES.every(m => estado.hechas[m.id]) && !estado.codigo) {
        estado.codigo = generarCodigo();
        guardar(); pintar();
        document.getElementById("recompensa").scrollIntoView({ behavior: "smooth", block: "center" });
      }
    };

    document.getElementById("btnCopiar").onclick = async () => {
      try {
        await navigator.clipboard.writeText(estado.codigo);
        toast("Código copiado 📋");
      } catch (e) {
        toast("Selecciona el código y cópialo manualmente.");
      }
    };

    document.getElementById("btnDiscord").href = DISCORD_URL;

    pintar();
  </script>
</body>
</html>
